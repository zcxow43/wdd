services:
  mysql:
    image: mysql:8.0.36
    container_name: wdd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wdd
      MYSQL_USER: app
      MYSQL_PASSWORD: "1234"
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - wdd-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "app", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wdd-mysql-data:
