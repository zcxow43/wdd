<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>品牌管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1440px;
    height: 900px;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f5f6f8;
    color: #1f2430;
    display: flex;
  }
  .sidebar {
    width: 220px;
    background: #1f2937;
    color: #cbd5e1;
    padding: 24px 0;
    flex-shrink: 0;
  }
  .sidebar .logo {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 0 24px 24px;
    border-bottom: 1px solid #334155;
    margin-bottom: 12px;
  }
  .sidebar .group-title {
    padding: 10px 24px 4px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 1px;
  }
  .sidebar .nav-item {
    padding: 10px 24px;
    font-size: 14px;
    cursor: default;
  }
  .sidebar .nav-item.active {
    background: #334155;
    color: #fff;
    border-left: 3px solid #3b82f6;
    font-weight: 600;
  }
  .main {
    flex: 1;
    padding: 32px 40px;
    overflow: hidden;
  }
  .breadcrumb {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 8px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #111827;
  }
  .card {
    background: #fff;
    border: 1px solid #e2e5eb;
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
    background: #f9fafb;
    padding: 14px 24px;
    border-bottom: 1px solid #e5e7eb;
  }
  tbody td {
    padding: 14px 24px;
    font-size: 14px;
    color: #1f2430;
    border-bottom: 1px solid #f1f2f5;
  }
  tbody tr:last-child td { border-bottom: none; }
  .code-cell { font-family: "SF Mono", Menlo, monospace; color: #374151; }
  .status-cell { display: flex; align-items: center; gap: 10px; }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: #d1d5db;
    flex-shrink: 0;
  }
  .toggle.on { background: #22c55e; }
  .toggle.disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .toggle.on .knob { left: 23px; }
  .status-label { font-size: 13px; color: #6b7280; }
  .status-label.on { color: #16a34a; font-weight: 600; }
  .status-label.pending { color: #6b7280; font-style: normal; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">匯率中心 WDD</div>
    <div class="group-title">匯率中心</div>
    <div class="nav-item">幣別管理</div>
    <div class="nav-item">幣別對管理</div>
    <div class="nav-item">價差群組管理</div>
    <div class="nav-item active">品牌管理</div>
    <div class="nav-item">審核紀錄</div>
  </div>
  <div class="main">
    <div class="breadcrumb">匯率中心 &gt; 品牌管理</div>
    <div class="page-title">品牌管理</div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:33%">品牌代碼</th>
            <th style="width:33%">品牌名稱</th>
            <th style="width:34%">狀態</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="code-cell">au</td>
            <td>au</td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
          </tr>
          <tr>
            <td class="code-cell">moneta</td>
            <td>moneta</td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
          </tr>
          <tr>
            <td class="code-cell">pug</td>
            <td>pug</td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
          </tr>
          <tr>
            <td class="code-cell">star</td>
            <td>star</td>
            <td><div class="status-cell"><div class="toggle disabled"><div class="knob"></div></div><span class="status-label pending" data-target>更新中...</span></div></td>
          </tr>
          <tr>
            <td class="code-cell">um</td>
            <td>um</td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
          </tr>
          <tr>
            <td class="code-cell">vjp</td>
            <td>vjp</td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
          </tr>
          <tr>
            <td class="code-cell">vt</td>
            <td>vt</td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
