<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; padding: 32px; background: #f4f5f7; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  .board { position: relative; display: flex; flex-direction: column; gap: 56px; width: max-content; }
  .row { display: flex; align-items: flex-start; gap: 40px; }
  figure { margin: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
  figure img { display: block; max-height: 480px; border-radius: 4px; }
  figcaption { margin-top: 8px; max-width: 360px; font-size: 14px; color: #333; text-align: center; }
  .arrows { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
</style></head>
<body><div class="board"><div class="row">
  <figure id="frame-0">
    <img src="step-1.png" />
    <figcaption>初始畫面：幣種對主檔列表，顯示現有的全域幣種對定義（USD/TWD、EUR/TWD、USD/JPY、GBP/TWD）</figcaption>
  </figure>
  <figure id="frame-1">
    <img src="step-2.png" />
    <figcaption>建立 AUD/TWD 幣種對主檔後，系統自動套用至所有品牌；切換到幣種對列表（品牌篩選：AU），可見新套用的 AUD/TWD（匯率類型：自動）。點擊「編輯」，將匯率類型改為手動並輸入匯率 21.5</figcaption>
  </figure>
  <figure id="frame-2">
    <img src="step-3.png" />
    <figcaption>送出修改申請後，於審核作業頁面開啟該筆待審核申請，比對修改前後差異（匯率類型：自動→手動，匯率：—→21.5，已標示變更），準備點擊「核准」</figcaption>
  </figure></div><div class="row">
  <figure id="frame-3">
    <img src="step-4.png" />
    <figcaption>核准後：AU 品牌的 AUD/TWD 幣種對已更新為手動匯率 21.5，審核狀態解除，編輯與刪除按鈕恢復可用</figcaption>
  </figure></div>
  <svg class="arrows" width="2438" height="1188">
    <defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#888" />
      </marker>
    </defs>
    <line x1="787.6666666666667" y1="68.73333333333333" x2="1123" y2="154.86666666666665" stroke="#888" stroke-width="3" marker-end="url(#arrowhead)" /><line x1="1368.3333333333333" y1="403.6666666666667" x2="1911.6666666666667" y2="160.99999999999997" stroke="#888" stroke-width="3" marker-end="url(#arrowhead)" /><line x1="2214.0666666666666" y1="408.2" x2="425" y2="908.3333333333334" stroke="#888" stroke-width="3" marker-end="url(#arrowhead)" />
  </svg></div></body></html>
