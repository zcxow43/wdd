<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>幣種對列表</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #f5f6f8; color: #1f2329; }
  .page { padding: 32px 40px; }
  .page-title { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; }
  .filter-bar select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: #fff; min-width: 140px; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eef0f3; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 20px; text-align: left; font-size: 14px; }
  th { color: #6b7280; font-weight: 500; border-bottom: 1px solid #eef0f3; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid #f3f4f6; }
  tr.highlight td { background: #ecfdf5; }
  .col-code { font-family: "SF Mono", Menlo, monospace; font-weight: 700; letter-spacing: .02em; }
  .col-rate { text-align: right; font-family: "SF Mono", Menlo, monospace; }
  .badge-rate { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .badge-manual { background: #eef2ff; color: #4338ca; }
  .badge-auto { background: #f0fdf4; color: #15803d; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #16a34a; }
  .status-text { font-size: 13px; }
  .row-actions button { background: none; border: none; color: #2563eb; font-size: 13px; cursor: pointer; padding: 2px 6px; }
  .row-actions button.danger { color: #dc2626; }
  .card-footer { padding: 12px 20px; font-size: 13px; color: #6b7280; border-top: 1px solid #eef0f3; }
</style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">幣種對列表</h1>
    <div class="filter-bar">
      <select><option>全部品牌</option><option selected>AU</option><option>MONETA</option><option>PUG</option><option>STAR</option><option>UM</option><option>VJP</option><option>VT</option></select>
      <select><option selected>全部狀態</option><option>啟用</option><option>停用</option></select>
    </div>
    <div class="card">
      <div class="card-header"><span>幣種對（品牌：AU）</span></div>
      <table>
        <thead>
          <tr>
            <th style="width:90px">品牌</th>
            <th style="width:90px">基準幣別</th>
            <th style="width:90px">對應幣別</th>
            <th style="width:110px" class="col-rate">匯率</th>
            <th style="width:100px">匯率類型</th>
            <th style="width:90px">狀態</th>
            <th style="width:130px">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="card-footer">Total <span id="count">5</span> items</div>
    </div>
  </div>
  <script>
    const pairs = [
      { base: 'USD', quote: 'TWD', rate: '32.5', type: '手動', active: true },
      { base: 'EUR', quote: 'TWD', rate: '34.1', type: '手動', active: true },
      { base: 'USD', quote: 'JPY', rate: null, type: '自動', active: true },
      { base: 'GBP', quote: 'TWD', rate: '40.2', type: '手動', active: true },
      { base: 'AUD', quote: 'TWD', rate: '21.5', type: '手動', active: true, approved: true },
    ]
    document.getElementById('rows').innerHTML = pairs.map(p => `
      <tr class="${p.approved ? 'highlight' : ''}" ${p.approved ? 'data-target' : ''}>
        <td class="col-code">AU</td>
        <td class="col-code">${p.base}</td>
        <td class="col-code">${p.quote}</td>
        <td class="col-rate">${p.rate ?? '—'}</td>
        <td><span class="badge-rate ${p.type === '手動' ? 'badge-manual' : 'badge-auto'}">${p.type}</span></td>
        <td><span class="dot on"></span><span class="status-text">${p.active ? '啟用' : '停用'}</span></td>
        <td class="row-actions"><button>編輯</button><button class="danger">刪除</button></td>
      </tr>`).join('')
    document.getElementById('count').textContent = pairs.length
  </script>
</body>
</html>
