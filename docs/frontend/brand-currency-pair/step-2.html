<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>品牌幣種對</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1440px;
    height: 900px;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f5f6f8;
    color: #1f2430;
    display: flex;
  }
  .sidebar {
    width: 220px;
    background: #1f2937;
    color: #cbd5e1;
    padding: 24px 0;
    flex-shrink: 0;
  }
  .sidebar .logo {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 0 24px 24px;
    border-bottom: 1px solid #334155;
    margin-bottom: 12px;
  }
  .sidebar .group-title {
    padding: 10px 24px 4px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 1px;
  }
  .sidebar .nav-item {
    padding: 10px 24px;
    font-size: 14px;
    cursor: default;
  }
  .sidebar .nav-item.active {
    background: #334155;
    color: #fff;
    border-left: 3px solid #3b82f6;
    font-weight: 600;
  }
  .main {
    flex: 1;
    padding: 32px 40px;
    overflow: hidden;
    position: relative;
  }
  .breadcrumb {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 8px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #111827;
  }
  .brand-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand-tab {
    padding: 10px 22px;
    border-radius: 8px;
    border: 1px solid #e2e5eb;
    background: #fff;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
    cursor: default;
  }
  .brand-tab.selected {
    background: #eff6ff;
    border-color: #2563eb;
    color: #2563eb;
  }
  .card {
    background: #fff;
    border: 1px solid #e2e5eb;
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
    background: #f9fafb;
    padding: 14px 24px;
    border-bottom: 1px solid #e5e7eb;
  }
  tbody td {
    padding: 14px 24px;
    font-size: 14px;
    color: #1f2430;
    border-bottom: 1px solid #f1f2f5;
  }
  tbody tr:last-child td { border-bottom: none; }
  .code-cell { font-family: "SF Mono", Menlo, monospace; color: #374151; }
  .actions-cell { display: flex; gap: 8px; }
  .btn {
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border: 1px solid transparent;
    cursor: default;
  }
  .btn-secondary { background: #fff; border-color: #d1d5db; color: #374151; }
  .btn-danger { background: #dc2626; color: #fff; }
  .radio-group { display: flex; gap: 14px; }
  .radio-option { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; cursor: default; }
  .radio-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    position: relative;
    flex-shrink: 0;
  }
  .radio-dot.selected { border-color: #2563eb; }
  .radio-dot.selected::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2563eb;
  }
  .rate-input {
    width: 120px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: "SF Mono", Menlo, monospace;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    color: #1f2430;
  }
  .rate-input::placeholder { color: #9ca3af; }
  .rate-input:disabled { background: #f3f4f6; color: #9ca3af; }
  .status-cell { display: flex; align-items: center; gap: 10px; }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: #d1d5db;
    flex-shrink: 0;
  }
  .toggle.on { background: #22c55e; }
  .toggle.disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .toggle.on .knob { left: 23px; }
  .status-label { font-size: 13px; color: #6b7280; }
  .status-label.on { color: #16a34a; font-weight: 600; }
  .status-label.pending { color: #6b7280; font-style: normal; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">匯率中心 WDD</div>
    <div class="group-title">匯率中心</div>
    <div class="nav-item">幣別管理</div>
    <div class="nav-item">幣別對管理</div>
    <div class="nav-item active">品牌幣種對</div>
    <div class="nav-item">價差群組管理</div>
    <div class="nav-item">品牌管理</div>
    <div class="nav-item">審核紀錄</div>
  </div>
  <div class="main">
    <div class="breadcrumb">匯率中心 &gt; 品牌幣種對</div>
    <div class="page-title">品牌幣種對</div>
    <div class="brand-selector">
      <div class="brand-tab selected">au</div>
      <div class="brand-tab">moneta</div>
      <div class="brand-tab">pug</div>
      <div class="brand-tab">star</div>
      <div class="brand-tab">um</div>
      <div class="brand-tab">vjp</div>
      <div class="brand-tab">vt</div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:18%">幣種對</th>
            <th style="width:24%">匯率類型</th>
            <th style="width:18%">匯率</th>
            <th style="width:18%">狀態</th>
            <th style="width:22%">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="code-cell">USD/TWD</td>
            <td>
              <div class="radio-group">
                <label class="radio-option"><span class="radio-dot selected"></span>自動</label>
                <label class="radio-option"><span class="radio-dot"></span>手動</label>
              </div>
            </td>
            <td><input class="rate-input" type="text" placeholder="-" disabled /></td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
            <td class="actions-cell">
              <button class="btn btn-secondary">儲存</button>
              <button class="btn btn-danger">刪除</button>
            </td>
          </tr>
          <tr>
            <td class="code-cell">EUR/TWD</td>
            <td>
              <div class="radio-group">
                <label class="radio-option"><span class="radio-dot selected"></span>自動</label>
                <label class="radio-option"><span class="radio-dot"></span>手動</label>
              </div>
            </td>
            <td><input class="rate-input" type="text" placeholder="-" disabled /></td>
            <td><div class="status-cell"><div class="toggle on"><div class="knob"></div></div><span class="status-label on">啟用</span></div></td>
            <td class="actions-cell">
              <button class="btn btn-secondary">儲存</button>
              <button class="btn btn-danger">刪除</button>
            </td>
          </tr>
          <tr>
            <td class="code-cell">USD/JPY</td>
            <td>
              <div class="radio-group">
                <label class="radio-option"><span class="radio-dot"></span>自動</label>
                <label class="radio-option"><span class="radio-dot selected"></span>手動</label>
              </div>
            </td>
            <td data-target><input class="rate-input" type="text" value="31.520000" /></td>
            <td><div class="status-cell"><div class="toggle"><div class="knob"></div></div><span class="status-label">停用</span></div></td>
            <td class="actions-cell">
              <button class="btn btn-secondary" data-trigger>儲存</button>
              <button class="btn btn-danger">刪除</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
