<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; padding: 32px; background: #f4f5f7; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  .board { position: relative; display: flex; flex-direction: column; gap: 56px; width: max-content; }
  .row { display: flex; align-items: flex-start; gap: 40px; }
  figure { margin: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
  figure img { display: block; max-height: 480px; border-radius: 4px; }
  figcaption { margin-top: 8px; max-width: 360px; font-size: 14px; color: #333; text-align: center; }
  .arrows { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
</style></head>
<body><div class="board"><div class="row">
  <figure id="frame-0">
    <img src="step-1.png" />
    <figcaption>初始畫面：au 的預設點差（入金 0.5% / 出金 0.8%）、一個尚無成員的 VIP 群組（入金 0.2% / 出金 0.3%），以及生效點差總覽 — 三個幣種對全部來源為「預設」。點差一律為百分比，以乘法套用在匯率上。</figcaption>
  </figure>
  <figure id="frame-1">
    <img src="step-2.png" />
    <figcaption>修改預設點差後點擊「儲存」：變更不會立即生效，而是送出審核申請。卡片標記「審核中」、欄位停用，生效點差總覽的數字完全沒有變動。</figcaption>
  </figure>
  <figure id="frame-2">
    <img src="step-3.png" />
    <figcaption>點擊「管理成員」：成員清單為空，下方只列出尚未加入任何群組的幣種對，勾選 USD/JPY 與 EUR/USD。</figcaption>
  </figure></div><div class="row">
  <figure id="frame-3">
    <img src="step-4.png" />
    <figcaption>點擊「加入」：同樣只是送出審核申請 — 成員數仍為 0、生效點差總覽仍全部套用預設，該群組標記「審核中」，待核准後才會真正加入。</figcaption>
  </figure></div>
  <svg class="arrows" width="2438" height="1208">
    <defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#888" />
      </marker>
    </defs>
    <line x1="398.8666666666667" y1="146.6" x2="971.5333333333333" y2="134.86666666666667" stroke="#888" stroke-width="3" marker-end="url(#arrowhead)" /><line x1="1466.5166666666667" y1="257.53333333333336" x2="1922.3333333333333" y2="249" stroke="#888" stroke-width="3" marker-end="url(#arrowhead)" /><line x1="2257.8" y1="353.26666666666665" x2="705.2666666666667" y2="1093.6666666666667" stroke="#888" stroke-width="3" marker-end="url(#arrowhead)" />
  </svg></div></body></html>
