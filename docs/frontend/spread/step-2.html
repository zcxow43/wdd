<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>點差管理</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #f5f6f8; color: #1f2329; }
  .page { padding: 32px 40px; }
  .page-title { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  .filter-card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .filter-row { display: flex; align-items: center; gap: 16px; }
  .filter-group { display: flex; align-items: center; gap: 10px; }
  .filter-label { font-size: 13px; color: #6b7280; font-weight: 500; }
  .filter-input { padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 14px; background: #fff; min-width: 160px; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(16,24,40,.04); margin-bottom: 20px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eef0f3; font-weight: 600; }
  .btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-secondary { background: #fff; color: #374151; border: 1px solid #d0d5dd; }
  .spread-default-body { display: flex; align-items: center; justify-content: space-between; padding: 20px; }
  .spread-default-values { display: flex; align-items: center; gap: 24px; font-size: 15px; }
  .spread-default-values b { font-weight: 700; color: #111827; margin-left: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 20px; text-align: left; font-size: 14px; }
  th { color: #6b7280; font-weight: 500; border-bottom: 1px solid #eef0f3; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid #f3f4f6; }
  .currency-code { display: inline-block; font-family: "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 700; background: #eef2ff; color: #3730a3; padding: 2px 8px; border-radius: 5px; margin: 2px 3px 2px 0; letter-spacing: .01em; }
  .table-footer { padding: 12px 20px; font-size: 13px; color: #6b7280; border-top: 1px solid #eef0f3; }
  .action-link { border: none; background: none; color: #2563eb; font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; margin-right: 14px; }
  .action-link.danger { color: #dc2626; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border-radius: 12px; width: 720px; max-height: 84vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(16,24,40,.25); }
  .modal-header { padding: 18px 24px; border-bottom: 1px solid #eef0f3; font-size: 16px; font-weight: 700; }
  .modal-body { padding: 20px 24px; }
  .form-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .form-field { flex: 1; }
  .form-field label { display: block; font-size: 13px; color: #374151; font-weight: 500; margin-bottom: 6px; }
  .form-field input { width: 100%; padding: 8px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 14px; }
  .form-field input::placeholder { color: #9ca3af; }
  .assigner-title { font-size: 13px; color: #374151; font-weight: 500; margin: 4px 0 8px; }
  .assigner { display: flex; gap: 16px; }
  .assigner-panel { flex: 1; border: 1px solid #e4e7ec; border-radius: 8px; overflow: hidden; }
  .assigner-panel-header { padding: 10px 14px; background: #f9fafb; font-size: 13px; font-weight: 600; border-bottom: 1px solid #eef0f3; }
  .assigner-list { max-height: 220px; overflow-y: auto; }
  .assigner-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid #f3f4f6; }
  .assigner-row:last-child { border-bottom: none; }
  .assigner-row-main { display: flex; flex-direction: column; }
  .assigner-hint { font-size: 11px; color: #b45309; margin-top: 2px; }
  .assigner-btn { border: 1px solid #d0d5dd; background: #fff; border-radius: 5px; font-size: 12px; padding: 4px 9px; cursor: pointer; color: #374151; }
  .assigner-empty { padding: 16px; font-size: 13px; color: #9ca3af; text-align: center; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid #eef0f3; display: flex; justify-content: flex-end; gap: 10px; }
</style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">點差管理</h1>

    <div class="filter-card">
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">品牌</span>
          <select class="filter-input"><option selected>VT</option></select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span>預設點差</span></div>
      <div class="spread-default-body">
        <div class="spread-default-values">
          <span>入金：<b>0.05</b></span>
          <span>出金：<b>0.05</b></span>
        </div>
        <button class="btn btn-secondary">編輯</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>客制點差群組</span>
        <button class="btn btn-primary">+新增群組</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>名稱</th>
            <th style="width:90px">入金點差</th>
            <th style="width:90px">出金點差</th>
            <th>幣種對</th>
            <th style="width:120px">操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="table-footer">Total <span id="count">1</span> items</div>
    </div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header" data-target>新增點差群組</div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-field">
            <label>名稱</label>
            <input type="text" placeholder="請輸入群組名稱">
          </div>
          <div class="form-field">
            <label>入金點差</label>
            <input type="number" placeholder="0.00">
          </div>
          <div class="form-field">
            <label>出金點差</label>
            <input type="number" placeholder="0.00">
          </div>
        </div>
        <div class="assigner-title">幣種對指派</div>
        <div class="assigner">
          <div class="assigner-panel">
            <div class="assigner-panel-header">未加入本群組</div>
            <div class="assigner-list" id="unassigned"></div>
          </div>
          <div class="assigner-panel">
            <div class="assigner-panel-header">已加入本群組</div>
            <div class="assigner-list" id="assigned"><div class="assigner-empty">尚未加入任何幣種對</div></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary">取消</button>
        <button class="btn btn-primary">送出</button>
      </div>
    </div>
  </div>

  <script>
    const existingGroups = { '歐系貨幣群組': ['USD/EUR', 'GBP/USD', 'EUR/JPY'] }
    const allPairs = ['USD/JPY', 'USD/EUR', 'GBP/USD', 'EUR/JPY', 'AUD/USD', 'NZD/USD']

    function ownerOf(pair) {
      for (const [name, members] of Object.entries(existingGroups)) {
        if (members.includes(pair)) return name
      }
      return null
    }

    document.getElementById('unassigned').innerHTML = allPairs.map(p => {
      const owner = ownerOf(p)
      return `<div class="assigner-row">
        <div class="assigner-row-main">
          <span class="currency-code">${p}</span>
          ${owner ? `<span class="assigner-hint">目前屬於：${owner}，核准後將自動移出</span>` : ''}
        </div>
        <button class="assigner-btn">加入 →</button>
      </div>`
    }).join('')

    document.getElementById('rows').innerHTML = `
      <tr>
        <td>歐系貨幣群組</td>
        <td>0.15</td>
        <td>0.25</td>
        <td><span class="currency-code">USD/EUR</span><span class="currency-code">GBP/USD</span><span class="currency-code">EUR/JPY</span></td>
        <td><button class="action-link">編輯</button><button class="action-link danger">刪除</button></td>
      </tr>`
  </script>
</body>
</html>
