<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>審核作業</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #f5f6f8; color: #1f2329; }
  .page { padding: 32px 40px; }
  .page-title { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  .filter-card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .filter-row { display: flex; align-items: center; gap: 20px; }
  .filter-group { display: flex; align-items: center; gap: 10px; }
  .filter-label { font-size: 13px; color: #6b7280; font-weight: 500; }
  .filter-input { padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 14px; background: #fff; min-width: 140px; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 20px; text-align: left; font-size: 14px; }
  th { color: #6b7280; font-weight: 500; border-bottom: 1px solid #eef0f3; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid #f3f4f6; }
  tr.highlight td { background: #fffbeb; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
  .badge-create { background: #dbeafe; color: #1d4ed8; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .action-link { border: none; background: none; color: #2563eb; font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; }
  .table-footer { padding: 12px 20px; font-size: 13px; color: #6b7280; border-top: 1px solid #eef0f3; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border-radius: 12px; width: 620px; max-height: 84vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(16,24,40,.25); }
  .modal-header { padding: 18px 24px; border-bottom: 1px solid #eef0f3; font-size: 16px; font-weight: 700; }
  .modal-body { padding: 20px 24px; }
  .diff-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  .diff-table th, .diff-table td { padding: 10px 14px; font-size: 13px; border: 1px solid #eef0f3; }
  .diff-table th { background: #f9fafb; color: #6b7280; font-weight: 500; text-align: left; }
  .diff-table td.before { color: #9ca3af; }
  .diff-table td.after { font-weight: 600; }
  .diff-table tr.changed td.after { background: #f0fdf4; color: #15803d; }
  .currency-code { display: inline-block; font-family: "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 700; background: #eef2ff; color: #3730a3; padding: 2px 8px; border-radius: 5px; margin: 2px 3px 2px 0; letter-spacing: .01em; }
  .meta-row { display: flex; gap: 24px; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid #eef0f3; display: flex; justify-content: flex-end; gap: 10px; }
  .btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-danger { background: #fff; color: #dc2626; border: 1px solid #fecaca; }
</style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">審核作業</h1>

    <div class="filter-card">
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">類型</span>
          <select class="filter-input"><option selected>全部</option></select>
        </div>
        <div class="filter-group">
          <span class="filter-label">狀態</span>
          <select class="filter-input"><option selected>待審核</option></select>
        </div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:80px">類型</th>
            <th>摘要</th>
            <th style="width:100px">申請人</th>
            <th style="width:170px">申請時間</th>
            <th style="width:90px">狀態</th>
            <th style="width:80px">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr class="highlight">
            <td><span class="badge badge-create">新增</span></td>
            <td>VT · 低點差群組</td>
            <td>Alice</td>
            <td>2026-08-13 10:24</td>
            <td><span class="badge badge-pending">待審核</span></td>
            <td><button class="action-link">查看</button></td>
          </tr>
        </tbody>
      </table>
      <div class="table-footer">Total 1 items</div>
    </div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header" data-target>審核異動申請 — 新增</div>
      <div class="modal-body">
        <table class="diff-table">
          <thead>
            <tr><th style="width:120px">欄位</th><th>修改前</th><th>修改後</th></tr>
          </thead>
          <tbody>
            <tr class="changed"><td>品牌</td><td class="before">—</td><td class="after">VT</td></tr>
            <tr class="changed"><td>名稱</td><td class="before">—</td><td class="after">低點差群組</td></tr>
            <tr class="changed"><td>入金點差</td><td class="before">—</td><td class="after">0.1</td></tr>
            <tr class="changed"><td>出金點差</td><td class="before">—</td><td class="after">0.2</td></tr>
            <tr class="changed">
              <td>幣種對</td>
              <td class="before">—</td>
              <td class="after"><span class="currency-code">USD/JPY</span><span class="currency-code">USD/EUR</span></td>
            </tr>
          </tbody>
        </table>
        <div class="meta-row">
          <span>申請人：Alice</span>
          <span>申請時間：2026-08-13 10:24</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger">拒絕</button>
        <button class="btn btn-primary" data-trigger>核准</button>
      </div>
    </div>
  </div>
</body>
</html>
