<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>審核作業</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #f5f6f8; color: #1f2329; }
  .page { padding: 32px 40px; filter: blur(1px); opacity: .6; }
  .page-title { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; }
  .filter-select { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: #fff; border: 1px solid #d8dce3; border-radius: 8px; font-size: 13px; color: #374151; }
  .filter-select .label { color: #6b7280; }
  .filter-select .arrow { color: #9ca3af; font-size: 11px; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eef0f3; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 20px; text-align: left; font-size: 14px; }
  th { color: #6b7280; font-weight: 500; border-bottom: 1px solid #eef0f3; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid #f3f4f6; }
  .col-summary { font-family: "SF Mono", Menlo, monospace; font-weight: 600; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; display: inline-block; }
  .badge-create { background: #eff6ff; color: #2563eb; }
  .badge-update { background: #fff7ed; color: #c2410c; }
  .badge-delete { background: #fef2f2; color: #dc2626; }
  .badge-pending { background: #fef9c3; color: #a16207; }
  .badge-approved { background: #f0fdf4; color: #16a34a; }
  .badge-rejected { background: #fef2f2; color: #dc2626; }
  .btn-view { padding: 6px 14px; border: 1px solid #d8dce3; border-radius: 6px; background: #fff; font-size: 13px; cursor: pointer; color: #374151; }
  .card-footer { padding: 12px 20px; font-size: 13px; color: #6b7280; border-top: 1px solid #eef0f3; }

  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; }
  .modal { width: 720px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; }
  .modal-header { padding: 20px 24px; font-size: 17px; font-weight: 600; border-bottom: 1px solid #eef0f3; }
  .modal-body { padding: 20px 24px; }
  .diff-note { font-size: 12px; color: #9ca3af; margin: 0 0 12px; }
  .diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .diff-table th { text-align: left; color: #6b7280; font-weight: 500; padding: 8px 10px; border-bottom: 1px solid #eef0f3; }
  .diff-table td { padding: 8px 10px; border-bottom: 1px solid #f3f4f6; font-family: "SF Mono", Menlo, monospace; }
  .diff-table tr.changed td { background: #fff7ed; }
  .diff-table tr.changed td:last-child { color: #c2410c; font-weight: 700; }
  .modal-meta { margin-top: 16px; font-size: 13px; color: #6b7280; display: flex; gap: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid #eef0f3; display: flex; justify-content: space-between; }
  .btn { padding: 9px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-reject { background: #fff; color: #dc2626; border: 1px solid #fca5a5; }
  .btn-approve { background: #2563eb; color: #fff; border: none; }
</style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">審核作業</h1>
    <div class="filter-bar">
      <span class="filter-select"><span class="label">類型</span> 全部 <span class="arrow">▾</span></span>
      <span class="filter-select"><span class="label">狀態</span> 待審核 <span class="arrow">▾</span></span>
    </div>
    <div class="card">
      <div class="card-header"><span>審核申請列表</span></div>
      <table>
        <thead>
          <tr>
            <th style="width:90px">類型</th>
            <th>摘要</th>
            <th style="width:110px">申請人</th>
            <th style="width:170px">申請時間</th>
            <th style="width:100px">狀態</th>
            <th style="width:100px">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="card-footer">Total <span id="count">3</span> items</div>
    </div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header" data-target>審核異動申請 — 修改</div>
      <div class="modal-body">
        <p class="diff-note">renderGenericDiff — 尚未有 CURRENCY_PAIR 專用渲染器，以通用鍵值表呈現</p>
        <table class="diff-table">
          <thead><tr><th>欄位</th><th>原值</th><th>新值</th></tr></thead>
          <tbody id="diff-rows"></tbody>
        </table>
        <div class="modal-meta">
          <span>申請人: Bob</span>
          <span>申請時間: 2026-07-29 10:00</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-reject">拒絕</button>
        <button class="btn btn-approve" data-trigger>核准</button>
      </div>
    </div>
  </div>

  <script>
    const actionLabels = { CREATE: ['新增', 'badge-create'], UPDATE: ['修改', 'badge-update'], DELETE: ['刪除', 'badge-delete'] }
    const statusLabels = { PENDING: ['待審核', 'badge-pending'], APPROVED: ['已核准', 'badge-approved'], REJECTED: ['已拒絕', 'badge-rejected'] }
    const requests = [
      { actionType: 'CREATE', summary: 'PUG · USD/TWD', requestedBy: 'Alice', requestedAt: '2026-07-29 09:15', status: 'PENDING' },
      { actionType: 'UPDATE', summary: 'AU · EUR/TWD', requestedBy: 'Bob', requestedAt: '2026-07-29 10:00', status: 'PENDING' },
      { actionType: 'DELETE', summary: 'VT · USD/EUR', requestedBy: 'Carol', requestedAt: '2026-07-28 16:40', status: 'PENDING' },
    ]
    document.getElementById('rows').innerHTML = requests.map(r => {
      const [actionText, actionClass] = actionLabels[r.actionType]
      const [statusText, statusClass] = statusLabels[r.status]
      return `
      <tr>
        <td><span class="badge ${actionClass}">${actionText}</span></td>
        <td class="col-summary">${r.summary}</td>
        <td>${r.requestedBy}</td>
        <td>${r.requestedAt}</td>
        <td><span class="badge ${statusClass}">${statusText}</span></td>
        <td><button class="btn-view">查看</button></td>
      </tr>`
    }).join('')
    document.getElementById('count').textContent = requests.length

    // renderGenericDiff: raw before/after keys as-is, highlighting keys whose value differs.
    const before = { brandCode: 'AU', baseCurrencyCode: 'EUR', quoteCurrencyCode: 'TWD', rate: '34.20', rateType: 'MANUAL', active: 'true' }
    const after  = { brandCode: 'AU', baseCurrencyCode: 'EUR', quoteCurrencyCode: 'TWD', rate: '34.85', rateType: 'MANUAL', active: 'true' }
    document.getElementById('diff-rows').innerHTML = Object.keys(before).map(key => {
      const changed = before[key] !== after[key]
      return `<tr class="${changed ? 'changed' : ''}"><td>${key}</td><td>${before[key]}</td><td>${after[key]}</td></tr>`
    }).join('')
  </script>
</body>
</html>
