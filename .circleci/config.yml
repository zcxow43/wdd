version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "develop/backend/pom.xml" }}
            - maven-deps-
      - run:
          name: Compile backend
          command: mvn -f develop/backend/pom.xml -B compile
      - run:
          name: Run backend tests
          command: mvn -f develop/backend/pom.xml -B test
      - save_cache:
          key: maven-deps-{{ checksum "develop/backend/pom.xml" }}
          paths:
            - ~/.m2
      - store_test_results:
          path: develop/backend/target/surefire-reports
      - store_artifacts:
          path: develop/backend/target/surefire-reports

  build-and-test-frontend:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "develop/frontend/package-lock.json" }}
            - npm-deps-
      - run:
          name: Install frontend dependencies
          command: npm ci --prefix develop/frontend
      - save_cache:
          key: npm-deps-{{ checksum "develop/frontend/package-lock.json" }}
          paths:
            - develop/frontend/node_modules
      - run:
          name: Build frontend
          command: npm run build --prefix develop/frontend
      - run:
          name: Run frontend tests
          command: npm test --prefix develop/frontend

workflows:
  build-test:
    jobs:
      - build-and-test
      - build-and-test-frontend
